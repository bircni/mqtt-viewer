name: Platforms

# macOS and Windows runners cost far more than Linux, so pushes and pull requests check Linux only and these
# run on demand, e.g. before a release or after platform-specific changes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Lets the TLS library build on Windows runners without NASM installed.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: platforms

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo test --workspace
