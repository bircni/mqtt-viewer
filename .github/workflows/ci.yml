name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The release script starts this on the commit it is about to tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  # What eframe needs to build on Linux.
  LINUX_PACKAGES: libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The integration tests start their own in-process broker.
      - name: cargo test
        run: cargo test --workspace

  # Needs no build: spelling, unused dependencies, licenses and advisories.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1
      - uses: cargo-bins/cargo-binstall@v1.26.0
      - name: cargo shear
        run: cargo binstall --no-confirm cargo-shear && cargo shear
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: taiki-e/install-action@cargo-tarpaulin

      # The drawing code in ui/ is exercised by the interaction tests but not counted.
      - name: cargo tarpaulin
        run: cargo tarpaulin --workspace --all-features --exclude-files 'apps/mqtt-viewer/src/ui/*' --fail-under 90 --out Xml --out Stdout
