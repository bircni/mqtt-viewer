[package]
name = "mqtt-viewer-core"
description = "Connection handling, topic tree, decoders and recording for mqtt-viewer."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
ciborium = "0.2.2"
directories = "6.0.0"
jiff = { version = "1.0.3", features = ["serde"] }
log = "0.4.35"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
rmpv = "1.3.1"
rumqttc = { version = "0.25.1", features = ["websocket", "use-rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
toml = "1.2.3"

[dev-dependencies]
insta = "1.49.0"
rcgen = "0.14.10"
rumqttc = "0.25.1"
rumqttd = "0.20.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }
toml = "1.2.3"
